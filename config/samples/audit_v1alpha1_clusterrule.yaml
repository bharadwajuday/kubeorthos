apiVersion: audit.kubeorthos.io/v1alpha1
kind: ClusterRule
metadata:
  labels:
    app.kubernetes.io/name: kubeorthos
    app.kubernetes.io/managed-by: kustomize
  name: clusterrule-sample
spec:
  action: Audit
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
  expectedNodeConfig:
    kubeletVersion: v1.34.0
    containerRuntime: containerd://1.7.29
    kernelVersion: 5.15.0-101-generic
    osImage: Ubuntu 22.04 LTS
    architecture: amd64
  expectedConditions:
    - type: Ready
      status: "True"
    - type: MemoryPressure
      status: "False"
    - type: DiskPressure
      status: "False"
  minimumResources:
    cpu: "2"
    memory: "2Gi"
    storage: "10Gi"
