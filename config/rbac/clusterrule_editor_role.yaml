# This rule is not used by the project kubeorthos itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the audit.kubeorthos.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: kubeorthos
    app.kubernetes.io/managed-by: kustomize
  name: clusterrule-editor-role
rules:
- apiGroups:
  - audit.kubeorthos.io
  resources:
  - clusterrules
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - audit.kubeorthos.io
  resources:
  - clusterrules/status
  verbs:
  - get
