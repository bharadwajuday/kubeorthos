---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-audit-kubeorthos-io-v1alpha1-clusterrule
  failurePolicy: Fail
  name: vclusterrule-v1alpha1.kb.io
  rules:
  - apiGroups:
    - audit.kubeorthos.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - clusterrules
  sideEffects: None
